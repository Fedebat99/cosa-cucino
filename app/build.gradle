plugins { id 'com.android.application' }
android {
  namespace 'it.cosacucino.app'
  compileSdk 34
  defaultConfig {
    applicationId 'it.cosacucino.app'
    minSdk 26
    targetSdk 34
    versionCode 4
    versionName '1.3'
  }
  signingConfigs {
    app {
      storeFile file('cosacucino.jks')
      storePassword 'cosacucino'
      keyAlias 'cosacucino'
      keyPassword 'cosacucino'
    }
  }
  buildTypes {
    release { minifyEnabled false; signingConfig signingConfigs.app }
  }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'androidx.webkit:webkit:1.11.0' }
